<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScoreCraft</title>
  <meta name="theme-color" content="#18181B">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #18181B; }
    #scorecraft_canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="scorecraft_canvas"></canvas>
  <!-- Built with: cargo build -p scorecraft-web --release --target wasm32-unknown-unknown
       wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/scorecraft-web.wasm -->
  <script type="module">
    import init from "./pkg/scorecraft-web.js";
    init();
  </script>
</body>
</html>
