[package]
name = "scorecraft"
description = "The ScoreCraft desktop app (eframe/wgpu) with the TCP control server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
eframe = { workspace = true, features = ["wgpu", "default_fonts", "accesskit", "clipboard", "wayland", "x11"] }
scorecraft-automation = { workspace = true }
scorecraft-devices = { workspace = true }
scorecraft-engine = { workspace = true }
scorecraft-ui-egui = { workspace = true }
serde_json = { workspace = true }

# Native file dialogs; Linux uses drag and drop and the command line until a portal picker lands.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.17", default-features = false }
# The metronome's click: audio output on Windows and macOS (Linux needs ALSA headers).
scorecraft-devices = { workspace = true, features = ["audio"] }

[dev-dependencies]
base64 = { workspace = true }
scorecraft-testkit = { workspace = true }

[lints]
workspace = true
