[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]
# Fuzz targets build with nightly in their own workspace (crates/pdf/fuzz/Cargo.toml).
exclude = ["crates/pdf/fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Brinsleym/enscore-cleanroom"

[workspace.dependencies]
# Workspace crates. Layering (who may depend on whom) is checked by `cargo xtask layers`.
scorecraft-geom = { path = "crates/geom" }
scorecraft-raster = { path = "crates/raster" }
scorecraft-pdf = { path = "crates/pdf" }
scorecraft-codecs = { path = "crates/codecs" }
scorecraft-midi = { path = "crates/midi" }
scorecraft-fsc = { path = "crates/fsc" }
scorecraft-doc = { path = "crates/doc" }
scorecraft-ops = { path = "crates/ops" }
scorecraft-ink = { path = "crates/ink" }
scorecraft-layout = { path = "crates/layout" }
scorecraft-text = { path = "crates/text" }
scorecraft-search = { path = "crates/search" }
scorecraft-algo = { path = "crates/algo" }
scorecraft-audio = { path = "crates/audio" }
scorecraft-practice = { path = "crates/practice" }
scorecraft-render = { path = "crates/render" }
scorecraft-gpu = { path = "crates/gpu" }
scorecraft-format = { path = "crates/format" }
scorecraft-io = { path = "crates/io" }
scorecraft-sync = { path = "crates/sync" }
scorecraft-metadata = { path = "crates/metadata" }
scorecraft-imslp = { path = "crates/imslp" }
scorecraft-scan = { path = "crates/scan" }
scorecraft-input = { path = "crates/input" }
scorecraft-devices = { path = "crates/devices" }
scorecraft-engine = { path = "crates/engine" }
scorecraft-ui-egui = { path = "crates/ui-egui" }
scorecraft-automation = { path = "crates/automation" }
scorecraft-testkit = { path = "crates/testkit" }

# PDFCraft's PDF stack (architecture §15, decision D1). Every pdfcraft-* crate and every
# [patch.crates-io] entry below uses this one revision (PDFCraft 0.15.0, main on 2026-10-30).
# Only scorecraft-pdf may depend on them (`cargo xtask layers`).
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
pdfcraft-fonts = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }

# The Craft suite's shared UI (architecture §16). craft-libs pins the suite's egui fork; the
# [patch.crates-io] egui and winit entries below use the revisions this craft-libs revision pins.
# Only scorecraft-ui-egui and the apps may take them (`cargo xtask layers`).
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "c39e435cc34417843793df240a0b38bac970179b" }
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }

# Third-party
base64 = "0.22"
bytemuck = "1"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.18"
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
# Font outlines and metrics for text notes and stamps; the version PDFCraft's fonts crate uses.
skrifa = "0.44"
unicode-normalization = "0.1.26"
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
toml = "0.9"

# Never-crash rules (docs/standards/never-crash.md). clippy.toml relaxes the panic lints in tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "warn"

[profile.release]
# Keep unwinding natively: the app shell's last-resort guard catches an escaped panic
# around dispatch, import and export (never-crash rule 7).
panic = "unwind"
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
# Dependencies optimised in dev builds so page rendering stays usable while debugging.
opt-level = 2

# PDFCraft patches hayro, lopdf and vello in its vendor/ directory. Patches apply only at the
# workspace root, so we repeat them, at PDFCraft's revision. Not its egui and winit patches: those
# are a UI matter (architecture §16).
[patch.crates-io]
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
vello_common = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }
vello_cpu = { git = "https://github.com/storytold/pdfcraft", rev = "65ff3a00c04ad5189f4a0abedcdf7104f14e2aed" }

# The suite's egui and winit forks, at the revisions craft-libs c39e435c pins: one egui in every
# build (architecture §16, `ONE_VERSION` in xtask/src/graph.rs).
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
