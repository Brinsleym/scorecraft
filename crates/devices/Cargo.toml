[package]
name = "scorecraft-devices"
description = "Platform services: MIDI ports, audio I/O, camera and keep-awake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["power"]
# Keep the screen awake (READ-9): SetThreadExecutionState on Windows.
power = ["dep:windows-sys"]
# The metronome's click (PRAC-1) through the default audio output. Off by default: the desktop
# app turns it on for Windows and macOS (Linux needs ALSA headers to build it).
audio = ["dep:cpal"]

[dependencies]
scorecraft-audio = { workspace = true }
cpal = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"], optional = true }

# The one crate allowed FFI (architecture §3): `unsafe_code` is `deny` instead of the
# workspace's `forbid`, so a feature-gated block can `#[allow]` it with a SAFETY comment.
# Everything else mirrors `[workspace.lints]`; `cargo xtask layers` checks they match.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "warn"
