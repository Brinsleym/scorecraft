# The shell (`ui.*`) commands the egui shell registers: pure view and window state that lives in
# the shell, not the engine (AGENTS.md rule 2). `cargo xtask parity` reads this list next to the
# engine's registry, so feature-map rows whose command is `ui.*` can count as live without xtask
# building egui. When the shell gains its command table, a ui-egui test checks that the table and
# this list match (`app::tests::shell_commands_match_the_parity_list`).
commands = [
    "ui.view.fullScreen",
    "ui.power.keepAwake",
    "ui.theme.set",
    "ui.chrome.toggle",
    "ui.library.show",
    "ui.library.view",
]
